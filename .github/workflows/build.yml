name: Build apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [all, linux, windows, macos]
        default: all
  push:
    tags: ["v*"]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      linux: ${{ steps.m.outputs.linux }}
    steps:
      - id: m
        shell: python
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          import json, os
          native = {"macos": {"os": "macos-14", "artifact": "BlendSketch-macOS"},
                    "windows": {"os": "windows-2022", "artifact": "BlendSketch-Windows"}}
          p = os.environ["PLATFORM"]
          inc = list(native.values()) if p == "all" else [native[p]] if p in native else []
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": inc}) + "\n")
              f.write("linux=" + ("true" if p in ("all", "linux") else "false") + "\n")

  build:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.matrix).include[0] }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest tests/test_playlist.py -q
      - name: Icons
        run: python packaging/make_icons.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: pyinstaller --noconfirm BlendSketch.spec
      - name: Decode check (ProRes)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_check_clip.py check.mov
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/BlendSketch.app/Contents/MacOS/BlendSketch; else BIN=dist/BlendSketch/BlendSketch.exe; fi
          "$BIN" --check check.mov
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent BlendSketch.app ../${{ matrix.artifact }}.zip
          else 7z a ../${{ matrix.artifact }}.zip BlendSketch; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  # Linux is built inside Rocky Linux 9 so the app links against Rocky's own glibc (2.34) and
  # runs on Rocky/RHEL/Alma 9 and anything newer. A build from a newer distro won't start there.
  build-linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: System packages
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=install_weak_deps=False \
            python3.12 python3.12-pip python3.12-libs binutils tar gzip findutils which git \
            mesa-libGL mesa-libEGL libglvnd-glx libglvnd-egl libxkbcommon libxkbcommon-x11 fontconfig freetype \
            dbus-libs glib2 libX11 libXext libXrender libSM libICE libxcb \
            xcb-util-cursor xcb-util-wm xcb-util-keysyms xcb-util-image xcb-util-renderutil \
            pulseaudio-libs alsa-lib dejavu-sans-fonts
      - uses: actions/checkout@v4
      - name: Python environment
        run: |
          python3.12 -m venv /opt/venv
          echo /opt/venv/bin >> "$GITHUB_PATH"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest tests/test_playlist.py -q
      - name: Icons
        run: python packaging/make_icons.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: pyinstaller --noconfirm BlendSketch.spec
      - name: Decode check (ProRes)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_check_clip.py check.mov
          dist/BlendSketch/BlendSketch --check check.mov
      - name: Report glibc requirement
        run: |
          echo "Rocky $(cat /etc/rocky-release)"
          echo "Highest glibc symbol needed by the bundle:"
          find dist/BlendSketch -type f \( -name '*.so*' -o -name BlendSketch \) -exec objdump -T {} + 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Package
        run: |
          cd dist
          tar czf ../BlendSketch-Linux-Rocky9.tar.gz BlendSketch
      - uses: actions/upload-artifact@v4
        with:
          name: BlendSketch-Linux-Rocky9
          path: BlendSketch-Linux-Rocky9.tar.gz

  # A pushed v* tag also publishes the apps as a GitHub release: the page the updater sends people
  # to when an update needs a new app (requirements.txt changed).
  release:
    needs: [build, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apps/* --repo "$GITHUB_REPOSITORY" --title "BlendSketch $GITHUB_REF_NAME" \
            --notes "Download the app for your system below. Later code updates install from inside the app (Help ▸ Check for Updates, or BlendSketch --update)."
